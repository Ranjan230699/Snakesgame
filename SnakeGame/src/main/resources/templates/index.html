<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <div class="game-card">
        <h1>🐍 Snake Game</h1>

        <div class="top-bar">
            <div class="score-box">
                Score: <span id="score">0</span>
            </div>

            <div class="difficulty-box">
                <label for="levelSelect">Speed:</label>
                <select id="levelSelect" onchange="changeSpeed()">
                    <option value="220">Easy</option>
                    <option value="150" selected>Medium</option>
                    <option value="80">High</option>
                </select>
            </div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <button class="start-btn" onclick="startGame()">▶ Start Game</button>

        <p class="hint">Use <span>⬆</span> <span>⬇</span> <span>⬅</span> <span>➡</span> arrow keys to move</p>
    </div>

    <script src="/game.js"></script>
</body>
</html>
